<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Newsroom Digest</title>
  <link rel="stylesheet" href="digest.css">
</head>
<body class="popup">
  <header>
    <div class="title"><h1>Newsroom</h1></div>
    <div class="tools">
      <span id="stamp" class="stamp"></span>
      <button id="run" class="primary" hidden>Refresh now</button>
      <button id="reload" class="ghost" title="Re-read the digest from the server">Reload</button>
    </div>
  </header>
  <p id="stale" class="stale" hidden></p>
  <p id="run-note" class="run-note" hidden></p>
  <div id="status" class="status">Loading…</div>
  <ol id="stories" class="stories" hidden></ol>
  <footer>
    <span id="panel" class="panel"></span>
    <a id="open-site" href="#" target="_blank" rel="noreferrer">Site</a>
    <a id="open-options" href="#">Settings</a>
  </footer>
  <script src="compat.js"></script>
  <script src="digest.js"></script>
  <script src="popup.js"></script>
</body>
</html>
